# 网页版自动发布到 GitHub Pages
#
# 每次推送到 main（或在 Actions 页面手动运行）时，在 GitHub 的 Ubuntu 机器上完整构建一遍：
#   工具链 → Linux 内核 → 用户态程序 → initramfs → 网页资源（v86 模拟器 + BIOS + 系统镜像）
# 也就是 scripts/build.sh 做的全部事情，然后把 web/ 目录发布成静态网站。
# web/lib 和 web/images 是构建产物，不在仓库里（见 .gitignore），所以必须在这里现场生成。
#
# 拉取请求（PR）也会完整构建一遍，用来提前发现构建问题，但只有 main 才会发布。
# 第一次使用前要在仓库的 Settings → Pages → Build and deployment → Source 里选 “GitHub Actions”。
name: 网页版（GitHub Pages）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只发布一次；正在进行的发布不取消，免得网站停在一半的状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # 内核源码包、musl 工具链、v86 下载缓存都很大且很少变：缓存起来，下次构建快很多。
      # 键里带上 env.sh 的哈希：改了内核/musl/v86 版本号就重新下载
      - name: 缓存下载和工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/sketchos-work/src/linux-*.tar.xz
            ~/sketchos-work/toolchain
            ~/sketchos-work/cache
            ~/sketchos-work/src/v86
          key: sketchos-work-${{ runner.os }}-${{ hashFiles('scripts/env.sh', 'scripts/toolchain.sh') }}

      - name: 构建（工具链、内核、用户态、initramfs、网页资源）
        run: bash scripts/build.sh

      - name: 检查网页资源齐全
        run: |
          for f in index.html lib/libv86.js lib/v86.wasm lib/seabios.bin lib/vgabios.bin \
                   images/bzImage images/initramfs.cpio.gz images/manifest.json; do
              test -s "web/$f" || { echo "缺少 web/$f"; exit 1; }
          done
          du -sh web web/lib web/images

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
