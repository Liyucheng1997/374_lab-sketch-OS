# /etc/sketch/services.conf — sinit（1 号进程）的服务表
#
# 开机时 sinit 从上到下逐行启动这些服务，并一直“看护”它们。每行的格式：
#
#   名称     策略      终端          [选项...]                       命令 参数...
#
# 名称   随便起，只能用字母、数字、_ - .（svc 命令里显示的就是它）
# 策略   respawn  退出后自动重启（10 秒内退出超过 5 次就放弃，状态变成 failed）
#        once     只启动一次，不管它什么时候结束
#        wait     启动后等它结束，再启动下面的服务（适合做准备工作的脚本）
# 终端   这个服务的标准输入/输出/错误，同时也是它的“控制终端”（Ctrl+C 才有用）；
#        /dev/ttyS0 是串口，/dev/tty1 是屏幕上的第一个虚拟终端，- 表示没有终端
# 选项   写在命令前面，形如 key=value：
#        log=文件       把输出追加写到这个文件（而不是终端）
#        cond=gui       只在图形模式下启动；cond=nogui 只在内核命令行带 sketch.nogui 时启动
#        delay=毫秒     每次启动前先等这么久
# 命令   按空白切分，可以用 "引号" 把带空格的参数括起来
#
# 注释必须单独占一行（以 # 开头）。
# 修改后运行  sinit --check  检查格式；运行  sinit reload（或 kill -HUP 1）让 sinit 启动新增的服务。
# 服务的实时状态在 /run/sinit/status，用 svc 命令查看。

# 名称     策略      终端          [选项...]                          命令及参数
serial     respawn   /dev/ttyS0                                       /bin/sksh -l
desktop    respawn   /dev/tty1     cond=gui log=/var/log/sketchd.log  /bin/sketchd
console    respawn   /dev/tty1     cond=nogui                         /bin/sksh -l
